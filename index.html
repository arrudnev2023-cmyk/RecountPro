<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>RecountPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --bg: #020617;
            --accent: #4f46e5;
            --accent2: #22c55e;
            --text: #f9fafb;
            --muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 15px;
        }
        .hero {
            text-align: center;
            max-width: 700px;
            margin: 60px auto 40px;
        }
        h1 {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        h1 span {
            background: linear-gradient(90deg, #4f46e5, #22c55e);
            -webkit-background-clip: text;
            color: transparent;
        }
        p {
            font-size: 18px;
            color: var(--muted);
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 380px;
            margin: 0 auto;
        }
        button {
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #22c55e);
            color: white;
        }
        .btn-secondary {
            background: #1f2937;
            color: white;
        }
        .btn-test {
            background: #22c55e;
            color: #000;
        }
        button:hover {
            transform: translateY(-3px);
        }
        footer {
            text-align: center;
            margin-top: 80px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RecountPro</div>
        <div class="subtitle">Склад • Инвентаризация • Касса</div>
    </header>

    <div class="hero">
        <h1>Умный учёт товара<br>всё в одном месте</h1>
        <p>Пересчёт, движение товаров, касса и аналитика — просто и быстро.</p>

        <div class="buttons">
            <a href="Login.html"><button class="btn-primary">Начать работу</button></a>
            <a href="recount-test.html"><button class="btn-test">Тесты (Демо)</button></a>
            <a href="login1.html"><button class="btn-secondary">Войти в кабинет</button></a>
        </div>
    </div>

    <footer>
        RecountPro © 2026 — Склад и инвентаризация без лишней сложности
    </footer>

</body>
</html>
