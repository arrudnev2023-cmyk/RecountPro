<!DOCTYPE html> 
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер ZXing</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .search-container {
      display: flex;
      gap: 10px;
      max-width: 620px;
      margin: 0 auto 20px;
    }
    #search {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.15rem;
      border: 2px solid #333;
      border-radius: 14px;
      background: #1a1a1a;
      color: #fff;
    }
    #scan-btn {
      padding: 14px 26px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .item {
      background: #1a1a1a;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      max-width: 620px;
      margin: 0 auto 8px;
    }
    #scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }
    .scanner-box {
      background: #111;
      width: 95%;
      max-width: 440px;
      border-radius: 18px;
      padding: 18px;
      position: relative;
    }
    video {
      width: 100%;
      border-radius: 14px;
      background: #000;
    }
    #scanner-status {
      text-align: center;
      color: #aaa;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    #torch-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Сканер ZXing</h1>

  <div class="search-container">
    <input type="text" id="search" placeholder="Поиск по коду...">
    <button id="scan-btn">📷 Сканировать</button>
  </div>

  <div id="list"></div>

  <!-- Модалка сканера -->
  <div id="scanner-modal">
    <div class="scanner-box">
      <button class="close-btn" id="close-scanner">✕</button>
      <h3 style="text-align:center; margin:0 0 12px;">Сканирование штрих-кода</h3>
      
      <video id="video" autoplay playsinline></video>
      <p id="scanner-status"></p>

      <button id="torch-btn">💡 Включить фонарик</button>
    </div>
  </div>

  <script>
    // ==================== ТЕСТОВЫЕ ДАННЫЕ ====================
    let items = [
      { code: "4600682057161", name: "Пиво светлое" },
      { code: "1234567890128", name: "Тестовый товар" },
    ];

    const listContainer = document.getElementById("list");
    const searchInput = document.getElementById("search");

    function renderList(filtered) {
      listContainer.innerHTML = "";
      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<strong>${item.code}</strong><br>${item.name}`;
        listContainer.appendChild(div);
      });
    }
    renderList(items);

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = items.filter(i => 
        i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    // ==================== ZXing СКАНЕР ====================
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let currentStream = null;
    let torchTrack = null;
    let isScanning = false;

    const modal = document.getElementById("scanner-modal");
    const statusEl = document.getElementById("scanner-status");
    const video = document.getElementById("video");
    const torchBtn = document.getElementById("torch-btn");

    document.getElementById("scan-btn").addEventListener("click", startScanning);
    document.getElementById("close-scanner").addEventListener("click", stopScanning);

    async function startScanning() {
      modal.style.display = "flex";
      statusEl.innerText = "Запуск камеры...";
      isScanning = true;

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        video.srcObject = currentStream;
        await video.play();

        const track = currentStream.getVideoTracks()[0];
        torchTrack = track;

        statusEl.innerText = "Наведи камеру на штрих-код";

        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
          if (result && isScanning) {
            handleScanSuccess(result.getText());
          }
        });

      } catch (err) {
        statusEl.innerText = "Ошибка доступа к камере";
        console.error(err);
      }
    }

    function handleScanSuccess(code) {
      stopScanning();
      searchInput.value = code;
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function stopScanning() {
      isScanning = false;

      if (codeReader) {
        codeReader.reset();
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      modal.style.display = "none";
      statusEl.innerText = "";
      torchTrack = null;
      torchBtn.innerText = "💡 Включить фонарик";
    }

    // ==================== ФОНАРИК ====================
    torchBtn.addEventListener("click", async () => {
      if (!torchTrack) {
        statusEl.innerText = "Фонарик недоступен";
        return;
      }

      try {
        const capabilities = torchTrack.getCapabilities();
        if (!capabilities.torch) {
          statusEl.innerText = "Фонарик не поддерживается";
          return;
        }

        const torchOn = torchBtn.innerText.includes("Выключить");
        await torchTrack.applyConstraints({ advanced: [{ torch: !torchOn }] });

        torchBtn.innerText = torchOn ? "💡 Включить фонарик" : "💡 Выключить фонарик";
      } catch (e) {
        statusEl.innerText = "Не удалось переключить фонарик";
        console.error(e);
      }
    });
  </script>

</body>
</html>
