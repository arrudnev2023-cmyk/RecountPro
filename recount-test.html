<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест сканера</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .search-container {
      display: flex;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    #search {
      flex: 1;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid #333;
      border-radius: 12px;
      background: #1f1f1f;
      color: #fff;
      outline: none;
    }
    #search:focus {
      border-color: #6d28d9;
    }
    #scan-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .item {
      background: #1f1f1f;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 12px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .item.match {
      border: 2px solid #22c55e;
    }
    /* Модалка сканера */
    #scanner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .scanner-box {
      background: #1a1a1a;
      width: 95%;
      max-width: 420px;
      border-radius: 16px;
      padding: 20px;
      position: relative;
    }
    #qr-reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    #scanner-status {
      text-align: center;
      color: #aaa;
      margin-top: 10px;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Тест сканера</h1>

  <!-- Поиск + кнопка сканирования -->
  <div class="search-container">
    <input type="text" id="search" placeholder="Поиск по коду или названию...">
    <button id="scan-btn">📷 Сканировать</button>
  </div>

  <!-- Список товаров (для теста фильтрации) -->
  <div id="list"></div>

  <!-- Модальное окно сканера -->
  <div id="scanner-modal">
    <div class="scanner-box">
      <button class="close-btn" id="close-scanner">✕</button>
      <h3 style="margin-top:0; text-align:center;">Сканирование штрих-кода</h3>
      <div id="qr-reader"></div>
      <p id="scanner-status"></p>
    </div>
  </div>

  <script>
    // ==================== ДАННЫЕ ДЛЯ ТЕСТА ====================
    let items = [
      { code: "123456", name: "Кофе растворимый 100г" },
      { code: "234567", name: "Чай чёрный 25 пакетиков" },
      { code: "345678", name: "Шоколад молочный 90г" },
      { code: "456789", name: "Печенье овсяное 300г" },
      { code: "567890", name: "Сахар песок 1кг" },
      { code: "678901", name: "Молоко 1л" },
    ];

    const listContainer = document.getElementById("list");
    const searchInput = document.getElementById("search");

    // Рендер списка
    function renderList(filteredItems) {
      listContainer.innerHTML = "";
      filteredItems.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <strong>${item.code}</strong><br>
          ${item.name}
        `;
        listContainer.appendChild(div);
      });
    }

    // Первоначальный рендер
    renderList(items);

    // Поиск
    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = items.filter(item => 
        item.code.toLowerCase().includes(query) || 
        item.name.toLowerCase().includes(query)
      );
      renderList(filtered);
    });

    // ==================== СКАНЕР ====================
    let html5QrCode = null;

    document.getElementById("scan-btn").addEventListener("click", () => {
      const modal = document.getElementById("scanner-modal");
      const status = document.getElementById("scanner-status");
      modal.style.display = "flex";
      status.innerText = "Запуск задней камеры...";

      const qrReader = document.getElementById("qr-reader");
      qrReader.innerHTML = "";

      html5QrCode = new Html5Qrcode("qr-reader");

      html5QrCode.start(
        { facingMode: { exact: "environment" } }, // Только задняя камера
        { fps: 10, qrbox: { width: 260, height: 260 } },
        (decodedText) => {
          // Успешно отсканировали
          handleScanSuccess(decodedText.trim());
        },
        (error) => {
          // Можно игнорировать
        }
      ).catch(err => {
        status.innerText = "Не удалось запустить камеру";
        console.error(err);
      });
    });

    // Закрытие модалки
    document.getElementById("close-scanner").addEventListener("click", () => {
      closeScanner();
    });

    function closeScanner() {
      const modal = document.getElementById("scanner-modal");
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          modal.style.display = "none";
        }).catch(() => {
          modal.style.display = "none";
        });
      } else {
        modal.style.display = "none";
      }
    }

    // Что делать после успешного сканирования
    function handleScanSuccess(code) {
      closeScanner();

      // Подставляем код в строку поиска
      searchInput.value = code;

      // Запускаем поиск (фильтрацию)
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));

      // Можно добавить визуальный эффект
      setTimeout(() => {
        searchInput.style.borderColor = "#22c55e";
        setTimeout(() => {
          searchInput.style.borderColor = "#333";
        }, 1500);
      }, 100);
    }
  </script>

</body>
</html>
