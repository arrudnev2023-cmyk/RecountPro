<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест сканера v2</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .search-container {
      display: flex;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    #search {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: 2px solid #333;
      border-radius: 12px;
      background: #1f1f1f;
      color: #fff;
    }
    #scan-btn {
      padding: 14px 22px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .item {
      background: #1f1f1f;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    #scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .scanner-box {
      background: #1a1a1a;
      width: 95%;
      max-width: 420px;
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }
    #qr-reader { width: 100%; border-radius: 12px; overflow: hidden; }
    #scanner-status { text-align: center; color: #aaa; margin-top: 8px; font-size: 0.95rem; }
    .close-btn {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none; color: #fff; font-size: 26px; cursor: pointer;
    }
    #torch-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Тест сканера v2</h1>

  <div class="search-container">
    <input type="text" id="search" placeholder="Поиск...">
    <button id="scan-btn">📷 Сканировать</button>
  </div>

  <div id="list"></div>

  <!-- Модалка сканера -->
  <div id="scanner-modal">
    <div class="scanner-box">
      <button class="close-btn" id="close-scanner">✕</button>
      <h3 style="text-align:center; margin: 0 0 10px;">Сканирование штрих-кода</h3>
      
      <div id="qr-reader"></div>
      <p id="scanner-status"></p>

      <!-- Кнопка фонарика -->
      <button id="torch-btn">💡 Включить фонарик</button>
    </div>
  </div>

  <script>
    // ==================== ТЕСТОВЫЕ ДАННЫЕ ====================
    let items = [
      { code: "4600682057161", name: "Пиво светлое ГОСТовское" },
      { code: "123456", name: "Кофе растворимый 100г" },
      { code: "234567", name: "Чай чёрный 25 пак." },
    ];

    const listContainer = document.getElementById("list");
    const searchInput = document.getElementById("search");

    function renderList(filtered) {
      listContainer.innerHTML = "";
      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<strong>${item.code}</strong><br>${item.name}`;
        listContainer.appendChild(div);
      });
    }
    renderList(items);

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase();
      const filtered = items.filter(i => i.code.includes(q) || i.name.toLowerCase().includes(q));
      renderList(filtered);
    });

    // ==================== СКАНЕР ====================
    let html5QrCode = null;
    let torchOn = false;
    let currentTrack = null;

    document.getElementById("scan-btn").addEventListener("click", () => {
      const modal = document.getElementById("scanner-modal");
      const status = document.getElementById("scanner-status");
      modal.style.display = "flex";
      status.innerText = "Запуск задней камеры...";

      const qrReader = document.getElementById("qr-reader");
      qrReader.innerHTML = "";

      html5QrCode = new Html5Qrcode("qr-reader");

      html5QrCode.start(
        { facingMode: "environment" },           // Задняя камера (без exact)
        { fps: 10, qrbox: { width: 280, height: 200 } },
        (decodedText) => {
          handleScanSuccess(decodedText.trim());
        },
        () => {}
      ).catch(err => {
        status.innerText = "Ошибка запуска камеры";
        console.error(err);
      });
    });

    // Закрытие
    document.getElementById("close-scanner").addEventListener("click", closeScanner);

    function closeScanner() {
      const modal = document.getElementById("scanner-modal");
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          modal.style.display = "none";
          torchOn = false;
          currentTrack = null;
        }).catch(() => modal.style.display = "none");
      } else {
        modal.style.display = "none";
      }
    }

    function handleScanSuccess(code) {
      closeScanner();
      searchInput.value = code;
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
    }

    // ==================== ФОНАРИК ====================
    document.getElementById("torch-btn").addEventListener("click", async () => {
      const btn = document.getElementById("torch-btn");
      const status = document.getElementById("scanner-status");

      if (!html5QrCode) return;

      try {
        const stream = html5QrCode.getRunningTrackCameraCapabilities
          ? await html5QrCode.getRunningTrackCameraCapabilities()
          : null;

        // Пробуем применить torch
        const track = html5QrCode.getRunningTrack();
        if (track) {
          currentTrack = track;
          await track.applyConstraints({ advanced: [{ torch: !torchOn }] });
          torchOn = !torchOn;
          btn.innerText = torchOn ? "💡 Выключить фонарик" : "💡 Включить фонарик";
          status.innerText = torchOn ? "Фонарик включён" : "";
        } else {
          status.innerText = "Фонарик не поддерживается";
        }
      } catch (e) {
        status.innerText = "Фонарик недоступен на этом устройстве";
        console.error(e);
      }
    });
  </script>

</body>
</html>
