<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер штрих-кодов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    
    body {
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    .title-font {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 16px;
      background: #111;
    }

    .barcode-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.5px;
    }

    .scan-success {
      animation: success-pop 0.4s ease;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-3">
          <div class="w-11 h-11 bg-emerald-600 rounded-2xl flex items-center justify-center">
            <span class="text-3xl">📷</span>
          </div>
          <h1 class="title-font text-4xl font-semibold tracking-tighter">Сканер</h1>
        </div>
        <p class="text-zinc-400 text-sm">Штрих-коды и QR • iPhone / Android</p>
      </div>

      <!-- Main Card -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
        
        <!-- Input -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-2 px-1">
            <label class="text-sm font-medium text-zinc-400">Штрих-код / QR-код</label>
            <span onclick="clearInput()" class="text-xs text-emerald-500 cursor-pointer active:text-emerald-400">очистить</span>
          </div>
          
          <div class="relative">
            <input 
              id="barcode-input" 
              type="text" 
              class="barcode-input w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 transition-all rounded-2xl px-5 py-4 text-2xl font-medium tracking-[1.5px] placeholder:text-zinc-600 outline-none"
              placeholder="0000000000000"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            >
            
            <!-- Copy button -->
            <button onclick="copyBarcode()" 
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 transition-colors rounded-2xl text-xl">
              📋
            </button>
          </div>
        </div>

        <!-- Scan Button -->
        <button onclick="startScanner()"
                class="w-full flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition-all text-white font-semibold py-[18px] rounded-2xl text-xl shadow-xl shadow-emerald-900/40 active:scale-[0.985]">
          <span class="text-2xl">📷</span>
          <span>Сканировать камерой</span>
        </button>

        <div class="mt-4 text-center">
          <p class="text-[10px] text-zinc-500">Задняя камера • работает на iOS и Android</p>
        </div>
      </div>

      <div class="text-center mt-6">
        <p class="text-xs text-zinc-500">При сканировании код автоматически подставится в строку выше</p>
      </div>
    </div>
  </div>

  <!-- Scanner Modal -->
  <div id="scanner-modal" onclick="if (event.target.id === 'scanner-modal') stopScanner()"
       class="hidden fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-4">
    
    <div onclick="event.stopImmediatePropagation()" 
         class="bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-[420px] overflow-hidden shadow-2xl">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <div>
          <div class="font-semibold text-lg">Сканирование</div>
          <div class="text-emerald-400 text-xs">Наведи камеру на код</div>
        </div>
        <button onclick="stopScanner()" 
                class="px-4 py-2 text-sm text-zinc-400 hover:text-white active:text-emerald-400 transition-colors">
          ✕ Закрыть
        </button>
      </div>

      <!-- Camera View -->
      <div id="reader" class="w-full bg-black" style="min-height: 320px; max-height: 65vh;"></div>

      <!-- Footer hint -->
      <div class="px-6 py-4 bg-zinc-950 text-center">
        <p class="text-xs text-zinc-400">
          Держи код в центре • 10–25 см • хорошее освещение
        </p>
      </div>
    </div>
  </div>

  <script>
    // Tailwind config
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#10b981');
    }

    let html5QrCode = null;
    let isScanning = false;

    // === START SCANNER ===
    async function startScanner() {
      const modal = document.getElementById('scanner-modal');
      const reader = document.getElementById('reader');

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader", {
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        });
      }

      try {
        // Получаем список камер и выбираем заднюю
        const cameras = await Html5Qrcode.getCameras();
        
        let cameraId = null;
        
        if (cameras && cameras.length > 0) {
          // Ищем заднюю камеру
          const backCamera = cameras.find(cam => 
            /back|rear|environment|задн|основн/i.test(cam.label)
          );
          
          cameraId = backCamera ? backCamera.id : cameras[cameras.length - 1].id;
        }

        const cameraConfig = cameraId ? cameraId : { facingMode: "environment" };

        const qrConfig = {
          fps: 15,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const size = Math.floor(minEdge * 0.72);
            return { width: size, height: size };
          }
        };

        await html5QrCode.start(
          cameraConfig,
          qrConfig,
          onScanSuccess,
          onScanFailure
        );

        isScanning = true;

      } catch (err) {
        console.error(err);
        alert("Не удалось запустить камеру.\n\nПроверь разрешения в Safari:\nНастройки → Safari → Камера → Разрешить");
        stopScanner();
      }
    }

    // === SUCCESS ===
    function onScanSuccess(decodedText, decodedResult) {
      const input = document.getElementById('barcode-input');
      
      input.value = decodedText;
      
      // Визуальный эффект успеха
      input.classList.add('!border-emerald-500', 'ring-4', 'ring-emerald-500/20');
      setTimeout(() => {
        input.classList.remove('!border-emerald-500', 'ring-4', 'ring-emerald-500/20');
      }, 1400);

      // Закрываем сканер
      stopScanner();

      // Показываем уведомление
      showToast(`✓ Отсканировано: ${decodedText}`);
    }

    function onScanFailure(err) {
      // Игнорируем большинство ошибок (это нормально)
    }

    // === STOP SCANNER ===
    async function stopScanner() {
      const modal = document.getElementById('scanner-modal');
      
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
        } catch (e) {
          // можно игнорировать
        }
        isScanning = false;
      }
      
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    // === COPY ===
    function copyBarcode() {
      const input = document.getElementById('barcode-input');
      if (!input.value.trim()) return;

      navigator.clipboard.writeText(input.value).then(() => {
        showToast('Скопировано в буфер обмена');
      }).catch(() => {
        // fallback
        input.select();
        document.execCommand('copy');
        showToast('Скопировано');
      });
    }

    // === CLEAR ===
    function clearInput() {
      const input = document.getElementById('barcode-input');
      input.value = '';
      input.focus();
    }

    // === TOAST ===
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3.5 rounded-2xl shadow-2xl text-sm font-medium z-[9999] flex items-center gap-2`;
      toast.innerHTML = `
        <span>${message}</span>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.transition = 'all 0.25s ease';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 2300);
    }

    // Инициализация
    function init() {
      initTailwind();
      
      // Можно сразу фокусировать input при тапе (удобно на телефоне)
      const input = document.getElementById('barcode-input');
      input.addEventListener('focus', () => {
        input.placeholder = '';
      });
    }

    window.onload = init;
  </script>
</body>
</html>
