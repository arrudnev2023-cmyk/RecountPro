<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Быстрый сканер (BarcodeDetector)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 12px;
    }
    h1 { text-align: center; margin-bottom: 14px; font-size: 1.25rem; }
    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    #search {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
    }
    #scan-btn {
      padding: 12px 18px;
      font-size: 1rem;
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
    }
    .item {
      background: #1a1a1a;
      padding: 13px;
      margin-bottom: 9px;
      border-radius: 12px;
      border-left: 5px solid #555;
    }
    .item.duplicate {
      border-left-color: #22c55e;
      background: #162d16;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .item-code { font-weight: bold; color: #a78bfa; }
    .item-count {
      background: #333;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.8rem;
    }
    #scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 99999;
      justify-content: center;
      align-items: flex-start;
      padding-top: 25px;
    }
    .scanner-box {
      background: #111;
      width: 94%;
      max-width: 420px;
      border-radius: 18px;
      padding: 16px;
      position: relative;
    }
    video {
      width: 100%;
      border-radius: 14px;
      background: #000;
    }
    #scanner-status {
      text-align: center;
      color: #aaa;
      margin: 8px 0;
      font-size: 0.9rem;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
    }
    #torch-btn {
      margin-top: 8px;
      width: 100%;
      padding: 11px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <h1>Быстрый сканер</h1>

  <div class="top-bar">
    <input type="text" id="search" placeholder="Поиск...">
    <button id="scan-btn">📷 Сканировать</button>
  </div>

  <div id="list"></div>

  <!-- Модалка -->
  <div id="scanner-modal">
    <div class="scanner-box">
      <button class="close-btn" id="close-scanner">✕</button>
      <h3 style="text-align:center; margin:0 0 8px;">Сканирование</h3>
      <video id="video" autoplay playsinline></video>
      <p id="scanner-status"></p>
      <button id="torch-btn">💡 Фонарик</button>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const listContainer = document.getElementById("list");
    const modal = document.getElementById("scanner-modal");
    const statusEl = document.getElementById("scanner-status");
    const torchBtn = document.getElementById("torch-btn");
    const scanBtn = document.getElementById("scan-btn");
    const video = document.getElementById("video");

    let items = [];
    let stream = null;
    let detector = null;
    let scanning = false;
    let animationFrame = null;

    function renderList() {
      listContainer.innerHTML = "";
      items.forEach(item => {
        const div = document.createElement("div");
        div.className = `item ${item.count > 1 ? 'duplicate' : ''}`;
        div.innerHTML = `
          <div class="item-header">
            <span class="item-code">${item.code}</span>
            <span class="item-count">×${item.count}</span>
          </div>
          <div>${item.name}</div>
        `;
        listContainer.appendChild(div);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = items.filter(i => 
        i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)
      );
      listContainer.innerHTML = "";
      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = `item ${item.count > 1 ? 'duplicate' : ''}`;
        div.innerHTML = `
          <div class="item-header">
            <span class="item-code">${item.code}</span>
            <span class="item-count">×${item.count}</span>
          </div>
          <div>${item.name}</div>
        `;
        listContainer.appendChild(div);
      });
    });

    scanBtn.addEventListener("click", startScanning);
    document.getElementById("close-scanner").addEventListener("click", stopScanning);

    async function startScanning() {
      modal.style.display = "flex";
      statusEl.innerText = "Запуск камеры...";

      try {
        // Проверяем поддержку BarcodeDetector
        if (!('BarcodeDetector' in window)) {
          statusEl.innerText = "Ваш браузер не поддерживает быстрый сканер";
          alert("К сожалению, ваш браузер не поддерживает BarcodeDetector. Попробуйте Chrome или Edge.");
          modal.style.display = "none";
          return;
        }

        detector = new BarcodeDetector({
          formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e']
        });

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        video.srcObject = stream;
        await video.play();

        statusEl.innerText = "Наведи камеру на штрих-код";
        scanning = true;
        scanLoop();

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Ошибка доступа к камере";
      }
    }

    async function scanLoop() {
      if (!scanning || !detector) return;

      try {
        const barcodes = await detector.detect(video);

        if (barcodes.length > 0) {
          const code = barcodes[0].rawValue;
          handleScanSuccess(code);
          return; // останавливаем цикл после успешного сканирования
        }
      } catch (e) {
        // игнорируем ошибки детекции
      }

      animationFrame = requestAnimationFrame(scanLoop);
    }

    function handleScanSuccess(code) {
      stopScanning();

      const existing = items.find(i => i.code === code);

      if (existing) {
        existing.count++;
        renderList();
      } else {
        const name = prompt("Введите название товара:", "Товар");
        if (name) {
          items.push({ code, name: name.trim(), count: 1 });
          renderList();
        }
      }
    }

    function stopScanning() {
      scanning = false;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      modal.style.display = "none";
      statusEl.innerText = "";
      torchBtn.innerText = "💡 Фонарик";
    }

    // Фонарик
    torchBtn.addEventListener("click", async () => {
      if (!stream) return;

      const track = stream.getVideoTracks()[0];
      if (!track) return;

      try {
        const capabilities = track.getCapabilities();
        if (!capabilities.torch) {
          statusEl.innerText = "Фонарик не поддерживается";
          return;
        }

        const isOn = torchBtn.innerText.includes("Выключить");
        await track.applyConstraints({ advanced: [{ torch: !isOn }] });
        torchBtn.innerText = isOn ? "💡 Фонарик" : "💡 Выключить";
      } catch (e) {
        statusEl.innerText = "Ошибка фонарика";
      }
    });
  </script>

</body>
</html>
