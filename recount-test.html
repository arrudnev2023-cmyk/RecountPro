<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .search-container {
      display: flex;
      gap: 10px;
      max-width: 620px;
      margin: 0 auto 20px;
    }
    #search {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.15rem;
      border: 2px solid #333;
      border-radius: 14px;
      background: #1a1a1a;
      color: #fff;
    }
    #scan-btn {
      padding: 14px 26px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }
    .scanner-box {
      background: #111;
      width: 95%;
      max-width: 440px;
      border-radius: 18px;
      padding: 18px;
      position: relative;
    }
    video {
      width: 100%;
      border-radius: 14px;
      background: #000;
    }
    #scanner-status {
      text-align: center;
      color: #aaa;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    #torch-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Сканер</h1>

  <div class="search-container">
    <input type="text" id="search" placeholder="Поиск по коду...">
    <button id="scan-btn">📷 Сканировать</button>
  </div>

  <div id="list"></div>

  <!-- Модалка -->
  <div id="scanner-modal">
    <div class="scanner-box">
      <button class="close-btn" id="close-scanner">✕</button>
      <h3 style="text-align:center; margin:0 0 12px;">Сканирование штрих-кода</h3>
      <video id="video" autoplay playsinline></video>
      <p id="scanner-status"></p>
      <button id="torch-btn">💡 Включить фонарик</button>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const modal = document.getElementById("scanner-modal");
    const statusEl = document.getElementById("scanner-status");
    const video = document.getElementById("video");
    const torchBtn = document.getElementById("torch-btn");

    let codeReader = null;
    let currentStream = null;
    let torchTrack = null;
    let isScanning = false;

    // Проверяем, загрузилась ли библиотека ZXing
    function initScanner() {
      try {
        if (typeof ZXing === 'undefined' || !ZXing.BrowserMultiFormatReader) {
          statusEl.innerText = "Ошибка: библиотека сканера не загрузилась";
          return false;
        }
        codeReader = new ZXing.BrowserMultiFormatReader();
        
        // Улучшаем распознавание
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        codeReader.setHints(hints);
        
        return true;
      } catch (e) {
        console.error(e);
        statusEl.innerText = "Ошибка инициализации сканера";
        return false;
      }
    }

    document.getElementById("scan-btn").addEventListener("click", () => {
      if (!initScanner()) {
        alert("Не удалось запустить сканер. Попробуй обновить страницу.");
        return;
      }
      startScanning();
    });

    document.getElementById("close-scanner").addEventListener("click", stopScanning);

    async function startScanning() {
      modal.style.display = "flex";
      statusEl.innerText = "Запуск камеры...";
      isScanning = true;

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        video.srcObject = currentStream;
        await video.play();

        const track = currentStream.getVideoTracks()[0];
        torchTrack = track;

        statusEl.innerText = "Наведи камеру на штрих-код";

        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
          if (result && isScanning) {
            handleScanSuccess(result.getText());
          }
        });

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Не удалось получить доступ к камере";
      }
    }

    function handleScanSuccess(code) {
      stopScanning();
      searchInput.value = code;
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function stopScanning() {
      isScanning = false;

      if (codeReader) {
        try { codeReader.reset(); } catch (e) {}
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      modal.style.display = "none";
      statusEl.innerText = "";
      torchTrack = null;
      torchBtn.innerText = "💡 Включить фонарик";
    }

    // Фонарик
    torchBtn.addEventListener("click", async () => {
      if (!torchTrack) {
        statusEl.innerText = "Фонарик недоступен";
        return;
      }
      try {
        const capabilities = torchTrack.getCapabilities();
        if (!capabilities.torch) {
          statusEl.innerText = "Фонарик не поддерживается";
          return;
        }
        const torchOn = torchBtn.innerText.includes("Выключить");
        await torchTrack.applyConstraints({ advanced: [{ torch: !torchOn }] });
        torchBtn.innerText = torchOn ? "💡 Включить фонарик" : "💡 Выключить фонарик";
      } catch (e) {
        statusEl.innerText = "Ошибка фонарика";
      }
    });
  </script>

</body>
</html>
