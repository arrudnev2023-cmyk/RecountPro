<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер штрих-кодов • Максимум</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: 'Inter', system_ui, sans-serif; }
    .title-font { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
    #reader video { width: 100% !important; height: auto !important; border-radius: 16px; background: #111; }
    .barcode-input { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: 0.5px; }
    .torch-btn { transition: all 0.2s ease; }
    .torch-btn.active { background-color: #f59e0b; color: white; }
    .tip-text { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-3">
          <div class="w-11 h-11 bg-emerald-600 rounded-2xl flex items-center justify-center">
            <span class="text-3xl">📷</span>
          </div>
          <h1 class="title-font text-4xl font-semibold tracking-tighter">Сканер Pro</h1>
        </div>
        <p class="text-zinc-400 text-sm">Максимальная чувствительность • Неровные поверхности</p>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
        
        <div class="mb-5">
          <div class="flex items-center justify-between mb-2 px-1">
            <label class="text-sm font-medium text-zinc-400">Штрих-код / QR-код</label>
            <span onclick="clearInput()" class="text-xs text-emerald-500 cursor-pointer active:text-emerald-400">очистить</span>
          </div>
          
          <div class="relative">
            <input id="barcode-input" type="text" 
                   class="barcode-input w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30 transition-all rounded-2xl px-5 py-4 text-2xl font-medium tracking-[1.5px] placeholder:text-zinc-600 outline-none"
                   placeholder="0000000000000" autocomplete="off" autocorrect="off" spellcheck="false">
            
            <button onclick="copyBarcode()" 
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 transition-colors rounded-2xl text-xl">
              📋
            </button>
          </div>
        </div>

        <button onclick="startScanner()"
                class="w-full flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition-all text-white font-semibold py-[18px] rounded-2xl text-xl shadow-xl shadow-emerald-900/40">
          <span class="text-2xl">📷</span>
          <span>Сканировать (максимальная чувствительность)</span>
        </button>

        <div class="mt-3 text-center">
          <p class="text-[10px] text-amber-400">Режим повышенной чувствительности • лучше работает на неровных и кривых поверхностях</p>
        </div>
      </div>

      <div class="text-center mt-6 text-xs text-zinc-500">
        iOS • Android • Лучше всего работает при хорошем освещении
      </div>
    </div>
  </div>

  <!-- Scanner Modal -->
  <div id="scanner-modal" onclick="if (event.target.id === 'scanner-modal') stopScanner()"
       class="hidden fixed inset-0 bg-black/95 z-[999] flex items-center justify-center p-4">
    
    <div onclick="event.stopImmediatePropagation()" 
         class="bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-[420px] overflow-hidden shadow-2xl">
      
      <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
        <div>
          <div class="font-semibold text-lg">Сканирование • Pro</div>
          <div class="text-emerald-400 text-xs">Повышенная чувствительность</div>
        </div>
        
        <div class="flex items-center gap-2">
          <button id="torch-btn" onclick="toggleTorch()"
                  class="torch-btn w-10 h-10 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 active:bg-amber-600 rounded-2xl text-xl transition-all">
            🔦
          </button>
          <button onclick="stopScanner()" 
                  class="px-4 py-2 text-sm text-zinc-400 hover:text-white active:text-emerald-400 transition-colors">
            ✕
          </button>
        </div>
      </div>

      <div id="reader" class="w-full bg-black" style="min-height: 340px; max-height: 60vh;"></div>

      <!-- Динамические подсказки -->
      <div class="px-5 py-4 bg-zinc-950 border-t border-zinc-800">
        <div id="dynamic-tip" 
             class="tip-text text-sm text-center text-emerald-300 font-medium min-h-[42px] flex items-center justify-center">
          Наведи камеру на код...
        </div>
      </div>

      <div class="px-5 py-3 bg-zinc-900 flex gap-2 border-t border-zinc-800">
        <button onclick="restartWithAggressiveSettings()"
                class="flex-1 py-2.5 text-sm bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 rounded-2xl transition-colors">
          🔄 Попробовать жёстче
        </button>
        <button onclick="stopScanner()"
                class="flex-1 py-2.5 text-sm bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 rounded-2xl transition-colors">
          Отмена
        </button>
      </div>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let torchEnabled = false;
    let tipInterval = null;
    let currentTipIndex = 0;

    const tips = [
      "Наведи камеру на код и держи ровно...",
      "Для неровных поверхностей — найди самый плоский участок",
      "Маленький код? Приблизи телефон ближе (10-15 см)",
      "Есть блики или темно? Нажми кнопку вспышки 🔦",
      "Код под углом? Попробуй чуть наклонить телефон",
      "Большой код? Отойди на 20-30 см",
      "Код на бутылке/банке? Поверни предмет или телефон",
      "Держи телефон стабильно 2-3 секунды",
      "Плохой результат? Нажми «Попробовать жёстче»"
    ];

    function startTipRotation() {
      const tipEl = document.getElementById('dynamic-tip');
      if (!tipEl) return;

      currentTipIndex = 0;
      tipEl.textContent = tips[0];

      if (tipInterval) clearInterval(tipInterval);

      tipInterval = setInterval(() => {
        if (!isScanning) { clearInterval(tipInterval); return; }
        currentTipIndex = (currentTipIndex + 1) % tips.length;
        tipEl.style.opacity = '0';
        setTimeout(() => {
          if (tipEl && isScanning) {
            tipEl.textContent = tips[currentTipIndex];
            tipEl.style.opacity = '1';
          }
        }, 280);
      }, 3800);
    }

    function stopTipRotation() {
      if (tipInterval) { clearInterval(tipInterval); tipInterval = null; }
    }

    async function startScanner(aggressive = false) {
      const modal = document.getElementById('scanner-modal');
      const torchBtn = document.getElementById('torch-btn');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      torchEnabled = false;
      if (torchBtn) torchBtn.classList.remove('active', 'bg-amber-500');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader", {
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        });
      }

      try {
        const cameras = await Html5Qrcode.getCameras();
        let cameraId = null;
        
        if (cameras && cameras.length > 0) {
          const backCamera = cameras.find(cam => 
            /back|rear|environment|задн|основн/i.test(cam.label)
          );
          cameraId = backCamera ? backCamera.id : cameras[cameras.length - 1].id;
        }

        const cameraConfig = cameraId ? cameraId : { facingMode: "environment" };

        const qrConfig = {
          fps: aggressive ? 22 : 18,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const size = Math.floor(minEdge * (aggressive ? 0.88 : 0.82));
            return { width: size, height: size };
          }
        };

        await html5QrCode.start(cameraConfig, qrConfig, onScanSuccess, onScanFailure);
        isScanning = true;
        startTipRotation();

        setTimeout(() => {
          if (html5QrCode && isScanning) {
            html5QrCode.applyVideoConstraints({
              advanced: [{ focusMode: "continuous" }]
            }).catch(() => {});
          }
        }, 700);

      } catch (err) {
        alert("Не удалось запустить камеру. Проверь разрешения в Safari.");
        stopScanner();
      }
    }

    function onScanSuccess(decodedText) {
      const input = document.getElementById('barcode-input');
      input.value = decodedText;
      input.classList.add('!border-emerald-500', 'ring-4', 'ring-emerald-500/20');
      setTimeout(() => input.classList.remove('!border-emerald-500', 'ring-4', 'ring-emerald-500/20'), 1400);
      stopScanner();
      showToast(`✓ Успешно: ${decodedText}`);
    }

    function onScanFailure(err) {}

    async function stopScanner() {
      const modal = document.getElementById('scanner-modal');
      const torchBtn = document.getElementById('torch-btn');
      
      stopTipRotation();

      if (html5QrCode && isScanning) {
        try {
          if (torchEnabled) {
            try { await html5QrCode.applyVideoConstraints({ advanced: [{ torch: false }] }); } catch(e){}
          }
          await html5QrCode.stop();
        } catch(e){}
        isScanning = false;
        torchEnabled = false;
        if (torchBtn) torchBtn.classList.remove('active', 'bg-amber-500');
      }
      
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    async function restartWithAggressiveSettings() {
      if (!isScanning) return;
      const tipEl = document.getElementById('dynamic-tip');
      if (tipEl) tipEl.textContent = "Переключаюсь на максимальную чувствительность...";

      try {
        await html5QrCode.stop();
        isScanning = false;
        await new Promise(r => setTimeout(r, 280));
        await startScanner(true);
      } catch (e) {
        showToast("Не удалось перезапустить.");
      }
    }

    async function toggleTorch() {
      const torchBtn = document.getElementById('torch-btn');
      if (!html5QrCode || !isScanning) return;
      const newState = !torchEnabled;

      try {
        await html5QrCode.applyVideoConstraints({ advanced: [{ torch: newState }] });
        torchEnabled = newState;
        if (torchBtn) {
          if (torchEnabled) {
            torchBtn.classList.add('active', 'bg-amber-500');
            torchBtn.classList.remove('bg-zinc-800');
          } else {
            torchBtn.classList.remove('active', 'bg-amber-500');
            torchBtn.classList.add('bg-zinc-800');
          }
        }
      } catch (err) {
        showToast("Вспышка не поддерживается");
      }
    }

    function copyBarcode() {
      const input = document.getElementById('barcode-input');
      if (!input.value.trim()) return;
      navigator.clipboard.writeText(input.value).then(() => showToast('Скопировано')).catch(() => { input.select(); document.execCommand('copy'); showToast('Скопировано'); });
    }

    function clearInput() {
      const input = document.getElementById('barcode-input');
      input.value = '';
      input.focus();
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3.5 rounded-2xl shadow-2xl text-sm font-medium z-[9999]`;
      toast.innerHTML = `<span>${message}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.transition = 'all 0.25s ease'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 200); }, 2600);
    }

    function init() {
      const input = document.getElementById('barcode-input');
      input.addEventListener('dblclick', () => startScanner());
    }
    window.onload = init;
  </script>
</body>
</html>
